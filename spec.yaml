repository:
  name: kanban-scribe
  description: KanbanScribe - A shared Google Sheets + AI-enhanced Kanban board and journal system for families and teams, syncing tasks, journaling, calendar events, and agile metrics with FamilyJewel Sentinel API compatibility.
  visibility: public
  license: MIT
  topics:
    - kanban
    - google-sheets
    - reactjs
    - fastapi
    - ai-journaling
    - d3js
    - calendar-integration
    - family-productivity

structure:
  components:
    - name: core
      description: Core logic for syncing, journaling, and Google Sheets task management
      language: python
      files:
        - src/core/__init__.py
        - src/core/sheet_sync.py
        - src/core/task_parser.py
        - src/core/calendar_linker.py
        - src/core/journal_processor.py
        - src/core/ai_connector.py
        - src/core/agile_estimator.py

    - name: frontend
      description: React/D3.js Kanban board with visual metrics, tagging, and drag-and-drop
      language: typescript
      files:
        - src/frontend/index.html
        - src/frontend/App.tsx
        - src/frontend/KanbanBoard.tsx
        - src/frontend/TaskForm.tsx
        - src/frontend/CalendarIntegration.tsx
        - src/frontend/styles.css

    - name: api
      description: FastAPI backend for task data, journal entries, and FamilyJewel Sentinel integration
      language: python
      files:
        - src/api/__init__.py
        - src/api/main.py
        - src/api/endpoints.py
        - src/api/models.py
        - src/api/sentinel_proxy.py

    - name: sheets
      description: Google Sheets Apps Script logic for syncing multiple family/team boards
      language: javascript
      files:
        - src/sheets/appscript.gs
        - src/sheets/validator.gs
        - src/sheets/triggers.gs

    - name: docs
      description: Documentation for setup, journaling, Google Sheets, and API integrations
      language: markdown
      files:
        - docs/index.md
        - docs/setup.md
        - docs/journaling.md
        - docs/api_reference.md
        - docs/calendar_sync.md
        - docs/sentinel_integration.md

    - name: config
      description: Configuration and deployment scripts
      language: various
      files:
        - package.json
        - requirements.txt
        - .env.example
        - docker-compose.yml
        - .github/workflows/ci.yml

features:
  - name: google_sheets_sync
    description: Sync tasks, due dates, and status with multiple Google Sheets via App Script
  - name: drag_drop_kanban
    description: Interactive Kanban board with drag-and-drop UI and family/team columns
  - name: journaling_ai
    description: Daily voice or text journal synced with task context and optional AI summaries
  - name: agile_metrics
    description: XS–XL estimations, team load tracking, and project budget logging
  - name: calendar_integration
    description: Export tasks and due dates to Google Calendar for family/team schedules
  - name: sentinel_bridge
    description: Proxy API module to bridge task summaries to FamilyJewel Sentinel for secure sync
  - name: multi_user_boards
    description: Support for multiple boards (e.g. per child/family member) across shared Google Sheets

readme:
  title: KanbanScribe
  tagline: Google Sheets + AI-enhanced Kanban for families and teams, integrating journaling and calendar sync with secure Sentinel support
  sections:
    - name: Overview
      content: >
        KanbanScribe is a shared productivity system designed for families or teams. It combines Google Sheets syncing, a drag-and-drop Kanban board, journaling with optional AI analysis, and full calendar export functionality—while also integrating with the Sentinel module from FamilyJewel for secure local data workflows.
    - name: Features
      content: |
        - Sync with multiple Google Sheets across family/team members
        - Drag-and-drop Kanban interface with XS–XL agile tags
        - Daily journal entry via text or speech with AI summary
        - Secure FamilyJewel Sentinel bridge for offline financial sync
        - Export to Google Calendar
        - Team task load and effort tracking
    - name: Technologies
      content: |
        - Python 3.10+ (FastAPI, gspread, openai, pandas)
        - React.js + TypeScript
        - D3.js for visualization
        - Google Apps Script (sync & validation)
        - SQLite (optional local cache)
    - name: Getting Started
      content: |
        1. Clone the repo
        2. Setup `.env` with Google credentials and OpenAI/Gemini key
        3. Run `docker-compose up`
        4. Access the dashboard at `http://localhost:3000`
        5. Configure the Google Sheet sync via provided Apps Script
    - name: Sentinel Integration
      content: |
        KanbanScribe can optionally sync high-level summaries (e.g. budget, time estimates) into FamilyJewel's local Sentinel module for secure planning insights.
        Set the `FAMILYJEWEL_SENTINEL_URL` in `.env` to enable.
    - name: License
      content: MIT License — see LICENSE file for details

files_content:
  .env.example: |
    GOOGLE_SHEETS_CREDENTIALS_JSON=your_json_here
    OPENAI_API_KEY=your_openai_key
    FAMILYJEWEL_SENTINEL_URL=http://localhost:8000/sync
    PORT=8000

  docs/index.md: |
    # KanbanScribe

    A visual, journal-integrated, Google-based task board for families and teams. Secure. Shareable. Smart.

    See:
    - `journaling.md` for daily journal use
    - `calendar_sync.md` for Google Calendar export
    - `sentinel_integration.md` to connect with FamilyJewel

  docs/sentinel_integration.md: |
    # Sentinel Bridge (FamilyJewel Integration)

    This component syncs summary task metadata (e.g., hours, tags, budgets) with FamilyJewel's secure Sentinel API.
    Configure with your local URL in `.env`. Data is anonymized and does not include full journal text.

    Endpoints:
    - `/sync/summary` (POST) — used by KanbanScribe
    - `/sync/status` (GET) — Sentinel status check