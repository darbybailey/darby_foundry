repository:
  name: ai-companions
  description: AI Companions - Modular persona-based AI system with customizable skins,
    voice memory, and secure user journaling
  visibility: public
  license: MIT
  topics:
  - ai
  - companions
  - voice-interface
  - journal
  - nlp
  - persona
  - privacy
  - react
  - fastapi
structure:
  components:
  - name: core
    description: Core logic and persona orchestration engine
    language: python
    files:
    - src/core/__init__.py
    - src/core/persona_manager.py
    - src/core/memory_engine.py
    - src/core/skinning_engine.py
  - name: api
    description: FastAPI backend for companion API endpoints
    language: python
    files:
    - src/api/__init__.py
    - src/api/main.py
    - src/api/endpoints.py
    - src/api/models.py
  - name: frontend
    description: React-based interface with persona skins and journaling
    language: typescript
    files:
    - src/frontend/index.html
    - src/frontend/App.tsx
    - src/frontend/PersonaSelector.tsx
    - src/frontend/JournalInterface.tsx
    - src/frontend/VoiceConsole.tsx
    - src/frontend/styles.css
  - name: persona
    description: Customizable persona data and skins
    language: json
    files:
    - src/persona/default.json
    - src/persona/therapist.json
    - src/persona/viking.json
  - name: docs
    description: Documentation for setup, API, and persona creation
    language: markdown
    files:
    - docs/index.md
    - docs/setup.md
    - docs/api_reference.md
    - docs/persona_creation.md
    - docs/privacy.md
  - name: config
    description: Configuration and deployment
    language: various
    files:
    - requirements.txt
    - package.json
    - .env.example
    - docker-compose.yml
    - .github/workflows/ci.yml
features:
- name: persona_system
  description: Create, customize, and select AI personas with unique behaviors and
    styles
- name: voice_memory
  description: Journaling via voice input with memory tagging and emotional tone detection
- name: privacy_mode
  description: Client-side encryption and data sovereignty enforcement
- name: journal_companion
  description: Private journaling assistant with memory graph and longitudinal emotional
    insights
- name: skin_switching
  description: UI skin and persona selector for immersive interaction
- name: fastapi_backend
  description: Secure backend for persona logic, journaling, and voice memory
- name: react_frontend
  description: Sleek, responsive frontend for user interaction
readme:
  title: AI Companions
  tagline: Modular persona-based journaling and interaction system with privacy-first
    design
  sections:
  - name: Overview
    content: AI Companions provides a secure, expressive platform for interacting
      with personalized AI personas, journaling via voice, and exploring emotional
      patterns over time.
  - name: Features
    content: '- Persona system with modular skins

      - Voice journaling with sentiment tagging

      - Privacy-preserving storage

      - FastAPI backend and React UI'
  - name: Technologies
    content: '- Python 3.10+

      - FastAPI

      - React/TypeScript

      - NLP/SpaCy

      - Docker/Kubernetes'
  - name: Getting Started
    content: '1. Clone the repo

      2. Setup `.env` file

      3. Run `docker-compose up`

      4. Access UI on `localhost:3000`, API on `localhost:8000/docs`'
  - name: License
    content: "MIT License \u2014 see LICENSE for details"
files_content:
  .env.example: 'API_KEY=your_api_key

    VOICE_MEMORY_DIR=/data/memories

    FRONTEND_URL=http://localhost:3000'
  docs/index.md: '# AI Companions

    This guide covers setup, personas, journaling tools, and system architecture.'
  docs/setup.md: '## Setup

    Use Docker Compose or manual setup to run backend and frontend services.'
  docs/persona_creation.md: '## Persona Creation

    Define persona behaviors, names, prompts, and tone inside JSON files in `src/persona/`.'
  docs/api_reference.md: '## API Reference

    FastAPI endpoints available at `/api/persona`, `/api/journal`, `/api/voice`.'
  docs/privacy.md: '## Privacy Model

    All memory data remains client-side encrypted. No personal data is stored on external
    servers.'
  requirements.txt: 'fastapi

    uvicorn

    pydantic

    python-dotenv

    spacy

    torch'
  package.json: '{ "name": "ai-companions", "version": "1.0.0", "scripts": { "start":
    "react-scripts start" } }'
