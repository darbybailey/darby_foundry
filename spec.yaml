---
repository:
  name: "mdvt"
  description: "Multilingual Dubbing Visualization Tool for content producers"
  visibility: "public"
  license: "MIT"
  topics:
    - "d3js"
    - "nlp"
    - "media"
    - "visualization"
    - "streaming"

structure:
  components:
    - name: "core"
      description: "Core NLP and translation engine"
      language: "Python"
      files:
        - "src/core/__init__.py"
        - "src/core/nlp_processor.py"
        - "src/core/translation_engine.py"

    - name: "frontend"
      description: "D3.js visualization dashboard"
      language: "TypeScript"
      files:
        - "src/frontend/App.tsx"
        - "src/frontend/Dashboard.tsx"
        - "src/frontend/Flywheel.tsx"

    - name: "api"
      description: "API for integrating translation and visualization"
      language: "Python"
      files:
        - "src/api/__init__.py"
        - "src/api/endpoints.py"

    - name: "docs"
      description: "Project documentation"
      language: "Markdown"
      files:
        - "docs/index.md"
        - "docs/api.md"
        - "docs/setup.md"

features:
  - name: "semantic-input"
    description: "Natural language processing for dubbing instructions"

  - name: "visualization"
    description: "Real-time D3.js dashboard for language completion and metrics"

  - name: "flywheel"
    description: "Interactive speed adjustment for language processing"

  - name: "sentiment-analysis"
    description: "Tone matching for dubbed content"