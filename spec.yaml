#!/usr/bin/env python3
"""
---
Darby Foundry v0.2 - Fixed

Builds a full repo from a spec.yaml file. This version:
- Fully parses nested paths
- Generates all declared files and folders
- Logs build output
"""

import os
import sys
import yaml
import argparse
import datetime
from pathlib import Path

def load_spec(path):
    with open(path, 'r') as f:
        return yaml.safe_load(f)

def create_file(path, header=""):
    os.makedirs(os.path.dirname(path), exist_ok=True)
    with open(path, 'w') as f:
        f.write(header)

def generate_file_content(file_path, component_name, description):
    now = datetime.datetime.now().strftime("%Y-%m-%d")
    ext = os.path.splitext(file_path)[1].lower()
    basename = os.path.basename(file_path)
    if ext == ".py":
        class_name = ''.join(x.capitalize() for x in os.path.splitext(basename)[0].split('_'))
        return f""""""
{basename} - {description}
Generated {now}
""""""

class {class_name}:
    def __init__(self):
        pass

    def run(self):
        print("Running {{self.__class__.__name__}}")
"""
    elif ext == ".md":
        return f"# {component_name}\n\n{description}\n\nGenerated {now}\n"
    elif ext in [".ts", ".tsx", ".js"]:
        return f"// {basename} - {description}\n// Generated {now}\n"
    elif ext == ".dart":
        return f"// Dart file: {basename} - {description}\n// Generated {now}\n"
    elif ext in [".yaml", ".yml", ".json"]:
        return f"# {basename} - generated {now}\n"
    else:
        return f"# File: {basename} - generated {now}\n"

def generate_all(spec, output_dir):
    components = spec.get("structure", {}).get("components", [])
    for component in components:
        name = component.get("name")
        desc = component.get("description", "")
        files = component.get("files", [])
        for f in files:
            full_path = os.path.join(output_dir, f)
            if not os.path.exists(full_path):
                content = generate_file_content(f, name, desc)
                create_file(full_path, content)
                print(f"[+] Created {full_path}")
            else:
                print(f"[=] Skipped existing {full_path}")

def main():
    parser = argparse.ArgumentParser()
    parser.add_argument('--spec', required=True, help='Path to spec.yaml')
    parser.add_argument('--output-dir', default='./output', help='Directory to output files')
    args = parser.parse_args()

    try:
        spec = load_spec(args.spec)
        generate_all(spec, args.output_dir)
        print("[✓] Build complete.")
    except Exception as e:
        print(f"[!] Error: {e}")
        sys.exit(1)

if __name__ == '__main__':
    main()
