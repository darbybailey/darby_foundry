readme:
  title: HybridMediaScaler
  tagline: Smart content delivery optimization for multilingual streaming at scale
  sections:
    - name: Overview
      content: >
        HybridMediaScaler is a content delivery optimization system for audio and video
        streaming. It uses adaptive bitrate encoding, real-time multilingual support,
        and a simulated global CDN to ensure quality experiences across diverse environments.
    - name: Features
      content: |
        - Adaptive FFmpeg encoding pipeline
        - Real-time multilingual switching
        - TensorFlow-based encoding optimization
        - Grafana dashboards for bandwidth and translation metrics
        - Global CDN simulation for low-latency delivery
    - name: Technologies Used
      content: |
        - Python 3.10+
        - TensorFlow
        - FFmpeg
        - FastAPI
        - Grafana + Prometheus
        - Docker + Kubernetes
    - name: Getting Started
      content: |
        1. Clone the repo
        2. Run `docker-compose up`
        3. Visit `localhost:3000` for dashboard and API docs
    - name: License
      content: MIT License — see LICENSE file for details

files_content:
  .env.example: |
