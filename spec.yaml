repository:
  name: mdvt
  description: Multilingual Dubbing Visualization Tool for content producers
  visibility: public
  license: MIT
  topics:
    - d3js
    - nlp
    - media
    - visualization
    - streaming

structure:
  components:
    - name: core
      description: Core NLP and translation engine
      language: python
      files:
        - src/core/__init__.py
        - src/core/nlp_processor.py
        - src/core/translation_engine.py
    - name: frontend
      description: D3.js visualization dashboard
      language: typescript
      files:
        - src/frontend/App.tsx
        - src/frontend/Dashboard.tsx
        - src/frontend/Flywheel.tsx
    - name: api
      description: API for integrating translation and visualization
      language: python
      files:
        - src/api/__init__.py
        - src/api/endpoints.py
    - name: docs
      description: Project documentation
      language: markdown
      files:
        - docs/index.md
        - docs/api.md
        - docs/setup.md

features:
  - name: semantic-input
    description: Natural language processing for dubbing instructions
  - name: visualization
    description: Real-time D3.js dashboard for language completion and metrics
  - name: flywheel
    description: Interactive speed adjustment for language processing
  - name: sentiment-analysis
    description: Tone matching for dubbed content

readme:
  title: Multilingual Dubbing Visualization Tool (MDVT)
  tagline: Enhance dubbing workflows with real-time NLP and interactive dashboards
  sections:
    - name: Overview
      content: >
        MDVT helps content producers and localizers manage multilingual dubbing projects with precision and speed.
        It features NLP-powered translation, real-time sentiment analysis, and an interactive D3.js dashboard.
    - name: Features
      content: |
        - Semantic NLP input for dubbing logic
        - D3.js real-time visualization dashboard
        - Interactive Flywheel control for adjusting processing speed
        - Sentiment-aware tone matching for translated voiceovers
    - name: Technologies Used
      content: |
        - Python 3.10+
        - FastAPI
        - D3.js
        - TypeScript
        - NLTK / SpaCy
    - name: Getting Started
      content: |
        1. Clone this repository
        2. Run `pip install -r requirements.txt`
        3. Start the API with `uvicorn src.api.endpoints:app --reload`
        4. Launch the frontend with `npm start` from `src/frontend`
    - name: License
      content: MIT License — see LICENSE file for details

files_content:
  .env.example: |
    API_KEY=replace_this_key
    TRANSLATION_ENDPOINT=https://api.translation.local

  requirements.txt: |
    fastapi
    uvicorn
    spacy
    nltk
    python-dotenv

  docs/index.md: |
    # MDVT Documentation

    Welcome to the MDVT platform. This system provides tools to manage, analyze, and visualize dubbing translation workflows.

    ## Modules
    - Core: NLP and translation engine
    - API: FastAPI backend for streaming endpoints
    - Frontend: Interactive D3.js interface
    - Flywheel: Dynamic visual language engine

  docs/api.md: |
    # MDVT API Reference

    The API exposes the following endpoints:

    - `/translate`: Accepts original lines and returns multilingual dubbing suggestions
    - `/flywheel`: Triggers adjustments to dubbing speed
    - `/sentiment`: Analyzes sentiment of input and maps tones to dubbed lines

  docs/setup.md: |
    # Setup Guide

    1. Install dependencies
    2. Configure environment variables
    3. Run backend and frontend apps
    4. Access dashboard at `localhost:3000`