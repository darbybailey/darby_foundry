repository:
  name: familyjewel
  description: FamilyJewel - A private Scottish-style family office app for Mimi MAMEEN,
    tracking bank accounts, credit cards, crypto, and logins with local input, secure
    Sentinel, and TILT gamified integration
  visibility: private
  license: MIT
  topics:
  - finance
  - portfolio-management
  - reactjs
  - python
  - d3js
  - tilt
  - security
structure:
  components:
  - name: core
    description: Core logic for portfolio tracking, encryption, and calculations
    language: python
    files:
    - src/core/__init__.py
    - src/core/portfolio_manager.py
    - src/core/data_encryptor.py
    - src/core/asset_calculator.py
    - src/core/update_tracker.py
  - name: input
    description: Manual text or speech input for asset values and market prices
    language: python
    files:
    - src/input/__init__.py
    - src/input/text_input.py
    - src/input/speech_input.py
    - src/input/price_input.py
    - src/input/input_validator.py
  - name: auth
    description: Secure local storage for passwords and logins
    language: python
    files:
    - src/auth/__init__.py
    - src/auth/password_manager.py
    - src/auth/login_store.py
    - src/auth/password_generator.py
  - name: dashboard
    description: React/D3.js dashboard for portfolio visualization
    language: typescript
    files:
    - src/dashboard/index.html
    - src/dashboard/Dashboard.tsx
    - src/dashboard/NetWorthViz.tsx
    - src/dashboard/AssetAllocationViz.tsx
    - src/dashboard/TrendsViz.tsx
    - src/dashboard/styles.css
  - name: sentinel
    description: Local pass-through server for internet toggle and API logins
    language: python
    files:
    - src/sentinel/__init__.py
    - src/sentinel/sentinel.py
    - src/sentinel/api_connector.py
    - src/sentinel/login_automator.py
  - name: chief_of_staff
    description: Cloud-facing framework for API registry and TILT integration
    language: python
    files:
    - src/chief_of_staff/__init__.py
    - src/chief_of_staff/api_registry.py
    - src/chief_of_staff/tilt_sync.py
    - src/chief_of_staff/game_mechanics.py
    - src/chief_of_staff/api_list.json
  - name: storage
    description: Encrypted SQLite for financial and login data
    language: sql
    files:
    - src/storage/schema.sql
    - src/storage/queries.sql
  - name: docs
    description: Documentation for setup, usage, and TILT integration
    language: markdown
    files:
    - docs/index.md
    - docs/setup.md
    - docs/input_guide.md
    - docs/dashboard_guide.md
    - docs/sentinel_guide.md
    - docs/tilt_integration.md
  - name: config
    description: Configuration files for local development
    language: various
    files:
    - package.json
    - requirements.txt
    - .env.example
    - docker-compose.yml
features:
- name: ad_hoc_input
  description: Manual text/speech input for assets and market prices with manual/automated
    tagging
- name: password_management
  description: Secure local storage for account logins and passwords
- name: master_dashboard
  description: Offline D3.js dashboard for net worth, assets, and trends
- name: internet_toggle
  description: On/off switch for internet access via Sentinel
- name: sentinel
  description: Local server for secure API logins and external syncing
- name: chief_of_staff
  description: Cloud framework for API registry and TILT gamified integration
- name: local_security
  description: Encrypted SQLite storage for offline operation
- name: family_office
  description: Private hub for managing all financial assets
